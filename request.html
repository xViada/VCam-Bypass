<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detect cameras</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #1e1e1e;
        color: #f0f0f0;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 460px;
        padding: 28px 32px;
        background: #262626;
        border-radius: 12px;
        text-align: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
      }
      p {
        font-size: 13px;
        color: #c8c8c8;
        line-height: 1.5;
      }
      #status {
        margin-top: 16px;
        font-size: 13px;
        min-height: 18px;
      }
      ul {
        text-align: left;
        font-size: 13px;
        color: #9fd6a3;
      }
      button {
        margin-top: 18px;
        padding: 9px 18px;
        border: none;
        border-radius: 6px;
        background: #4c8bf5;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      .gh-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 22px;
        padding-top: 14px;
        border-top: 1px solid #333;
        width: 100%;
        justify-content: center;
        font-size: 12px;
        color: #707070;
        text-decoration: none;
        transition: color 0.2s;
      }
      .gh-link:hover {
        color: #9ab8d8;
      }
      .gh-link svg {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Detect cameras</h1>
      <p>
        When Chrome asks, click <strong>Allow</strong> to grant camera access.
        This is only used to read the names of your webcams so you can choose
        which one to disguise. Nothing is recorded or sent anywhere.
      </p>
      <div id="status">Requesting permission...</div>
      <div id="list"></div>
      <button id="retry">Retry</button>
      <a class="gh-link" href="https://github.com/xViada/VCam-Bypass" target="_blank" rel="noopener">

        </svg>
        github.com/xViada/VCam-Bypass
      </a>
    </div>
    <script src="request.js"></script>
  </body>
</html>
